name: Maven Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean verify

  schema-diff:
    needs: build
    # What the pull request changes in the schema, drawn and posted as a comment on it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Comment with the schema changes
        uses: schemadrawer-com/action@v3
        with:
          sql-directory: migrations
          migration-type: FLYWAY
          database-type: POSTGRESQL
          database-version: '18'
